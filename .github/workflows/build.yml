name: Build Zenku FrameProbe C++

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S app -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release -j2

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          SO="$(find build -type f -name 'libzenku_frameprobe.so' -print -quit)"
          test -n "$SO"
          test -s "$SO"

          rm -rf dist
          mkdir -p dist/zenku_frameprobe/zygisk

          cp "$SO" dist/zenku_frameprobe/zygisk/arm64-v8a.so
          cp module/module.prop dist/zenku_frameprobe/module.prop
          cp module/service.sh dist/zenku_frameprobe/service.sh
          cp module/uninstall.sh dist/zenku_frameprobe/uninstall.sh

          chmod 0755             dist/zenku_frameprobe/service.sh             dist/zenku_frameprobe/uninstall.sh

          cd dist
          zip -r Zenku-FrameProbe-v2.0.zip zenku_frameprobe
          unzip -t Zenku-FrameProbe-v2.0.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenku-FrameProbe-v2.0
          path: dist/Zenku-FrameProbe-v2.0.zip
          if-no-files-found: error
