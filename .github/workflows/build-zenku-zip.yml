name: Build ZENKU Magisk ZIP R5.4.15 FULL VISUAL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Validate module and GPUD controls
        shell: bash
        run: |
          set -euo pipefail
          test -s module.prop
          test -s META-INF/com/google/android/update-binary
          test -s customize.sh
          test -s post-fs-data.sh
          test -s system.prop
          test -s tools/gpud-lab-v2/ZENKU_GPUD_BATCH_LAB_V2.zip
          mkdir -p "$RUNNER_TEMP/gpud-lab-v2"
          unzip -q tools/gpud-lab-v2/ZENKU_GPUD_BATCH_LAB_V2.zip -d "$RUNNER_TEMP/gpud-lab-v2"
          test -s "$RUNNER_TEMP/gpud-lab-v2/gpud_batch_v2.sh"
          test -s "$RUNNER_TEMP/gpud-lab-v2/gpud_probe.c"
          bash -n customize.sh
          bash -n post-fs-data.sh
          bash -n service.sh
          bash -n phase_tuner.sh
          bash -n surfaceflinger_opt.sh
          bash -n visual_tuner.sh
          node --check webroot/visual.js
          bash -n renderer_capabilities.sh
          bash -n "$RUNNER_TEMP/gpud-lab-v2/gpud_batch_v2.sh"
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsyntax-only "$RUNNER_TEMP/gpud-lab-v2/gpud_probe.c"
          grep -q '^versionCode=24$' module.prop
          grep -q '^debug.egl.force_msaa=true$' system.prop
          grep -q '^debug.gpu.force.highp=1$' system.prop
          grep -q '^ro.lmk.psi_partial_stall_ms=70$' system.prop
          grep -q '^ro.lmk.swap_free_low_percentage=20$' system.prop
      - name: Build flashable ZIP outside workspace
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$RUNNER_TEMP/ZENKU_R5.4.15_VISUAL_FULL.zip"
          cd "$GITHUB_WORKSPACE"
          zip -qr "$ZIP_PATH" . -x '.git/*' '.github/*' 'tools/*' 'tools/**' '*.zip'
          unzip -t "$ZIP_PATH"
          unzip -l "$ZIP_PATH" > "$RUNNER_TEMP/zip-list.txt"
          grep -q 'module.prop' "$RUNNER_TEMP/zip-list.txt"
          grep -q 'visual_tuner.sh' "$RUNNER_TEMP/zip-list.txt"
          grep -q 'webroot/visual.html' "$RUNNER_TEMP/zip-list.txt"
          if tail -n +2 "$RUNNER_TEMP/zip-list.txt" | grep -Fq 'ZENKU_R5.4.15_VISUAL_FULL.zip'; then
            echo "Output ZIP was accidentally included in itself."
            exit 1
          fi
          sha256sum "$ZIP_PATH"
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZENKU-R5.4.15-FULL-VISUAL
          path: ${{ runner.temp }}/ZENKU_R5.4.15_VISUAL_FULL.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload standalone GPUD lab
        uses: actions/upload-artifact@v4
        with:
          name: ZENKU-GPUD-BATCH-LAB-V2
          path: tools/gpud-lab-v2/ZENKU_GPUD_BATCH_LAB_V2.zip
          if-no-files-found: error
          retention-days: 30
