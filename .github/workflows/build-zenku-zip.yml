name: Build ZENKU Magisk ZIP R5.4.13 RAM MODERATE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Validate module
        shell: bash
        run: |
          set -euo pipefail
          test -s module.prop
          test -s META-INF/com/google/android/update-binary
          test -s customize.sh
          test -s post-fs-data.sh
          test -s system.prop
          bash -n customize.sh
          bash -n post-fs-data.sh
          bash -n service.sh
          bash -n phase_tuner.sh
          bash -n surfaceflinger_opt.sh
          bash -n visual_tuner.sh
          bash -n renderer_capabilities.sh
          grep -q '^versionCode=22$' module.prop
          grep -q '^ro.lmk.psi_partial_stall_ms=70$' system.prop
          grep -q '^ro.lmk.swap_free_low_percentage=20$' system.prop
      - name: Build flashable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME=ZENKU_R5.4.13_RAM_MODERATE.zip
          zip -qr "$ZIP_NAME" . -x '.git/*' '.github/*' '*.zip'
          unzip -t "$ZIP_NAME"
          sha256sum "$ZIP_NAME"
      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZENKU-R5.4.13-RAM-MODERATE
          path: ZENKU_R5.4.13_RAM_MODERATE.zip
          if-no-files-found: error
          retention-days: 30
